<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Royal Kitchen - Food Safety Document</title>

    <meta name="description" content="View the Royal Kitchen food safety document.">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #e8ebf0;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* Header */
        .header {
            width: 100%;
            min-height: 65px;
            padding: 12px 20px;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            z-index: 1;
        }

        .header h1 {
            margin: 0;
            font-size: clamp(16px, 2.5vw, 22px);
            color: #183153;
        }

        .open-button {
            display: inline-block;
            padding: 11px 18px;
            background: #0756c9;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            text-align: center;
            transition: background 0.2s ease;
        }

        .open-button:hover {
            background: #0645a3;
        }

        .open-button:focus-visible {
            outline: 3px solid #8ab4ff;
            outline-offset: 3px;
        }

        /* PDF viewer area */
        .document-container {
            flex: 1;
            width: 100%;
            min-height: 0;
            overflow: hidden;
            background: #e8ebf0;
        }

        .document-container iframe {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 400px;
            border: none;
            background: #ffffff;
        }

        /* Footer */
        .footer {
            padding: 10px 15px;
            background: #ffffff;
            color: #555555;
            text-align: center;
            font-size: 12px;
        }

        /* Tablet and mobile screens */
        @media (max-width: 600px) {
            .header {
                padding: 10px 12px;
                gap: 8px;
            }

            .header h1 {
                font-size: 16px;
            }

            .open-button {
                padding: 10px 12px;
                font-size: 12px;
            }

            .document-container iframe {
                min-height: 300px;
            }

            .footer {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>Royal Kitchen</h1>

        <a
            class="open-button"
            href="./ROYAL%20KITCHEN%20.pdf"
            target="_blank"
            rel="noopener noreferrer">
            Open PDF ↗
        </a>
    </header>

    <main class="document-container">
        <iframe
            src="cia-rdp96-00788r001700210023-7.pdf"
            title="Royal Kitchen Food Safety Document">
            <p>
                Your browser cannot display this PDF.
                <a href="./cia-rdp96-00788r001700210023-7.pdf">Open the PDF here.</a>
            </p>
        </iframe>
    </main>

    <footer class="footer">
        Royal Kitchen | Food Safety Document
    </footer>

</body>
</html>
